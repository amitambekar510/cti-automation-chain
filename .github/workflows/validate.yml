name: Validate CTI v2 planning
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/plan_environment.py --input examples/environment.sample.json --output /tmp/cti-plan.md
      - run: test -s /tmp/cti-plan.md
      - run: python -m compileall -q scripts
